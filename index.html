<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=1024" />
        <title>The Goy List</title>

        <link rel="icon" href="/list_icon.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@500;700&display=swap" rel="stylesheet" />
        <link rel="stylesheet" type="text/css" href="/css/reset.css" />
        <link rel="stylesheet" type="text/css" href="/css/typography.css" />
        <link rel="stylesheet" type="text/css" href="/css/main.css" />
        <link rel="stylesheet" type="text/css" href="/css/pages/list.css" />
        <link rel="stylesheet" type="text/css" href="/css/pages/leaderboard.css" />
        <link rel="stylesheet" type="text/css" href="/css/pages/roulette.css" />
        <link rel="stylesheet" type="text/css" href="/css/components/nav.css" />
        <link rel="stylesheet" type="text/css" href="/css/components/btn.css" />
        <link rel="stylesheet" type="text/css" href="/css/components/tabs.css" />
        
        <script src="https://unpkg.com/vue@3.2.31/dist/vue.global.js"></script>
        <script src="https://unpkg.com/vue-router@4.0.14/dist/vue-router.global.prod.js"></script>
        <script type="module" src="/js/main.js"></script>

        <style>
            /* Modal overlay panels styled precisely to match your screenshots */
            .custom-modal-overlay {
                position: fixed;
                top: 0; left: 0; width: 100%; height: 100%;
                background: rgba(0, 0, 0, 0.6);
                display: flex; justify-content: center; align-items: center;
                z-index: 99999;
            }
            .form-container {
                background: #ffffff;
                padding: 40px 30px;
                border-radius: 20px;
                width: 400px;
                box-shadow: 0 12px 30px rgba(0,0,0,0.15);
                font-family: 'Lexend Deca', sans-serif;
                color: #000000;
                position: relative;
                text-align: center;
            }
            .form-container h2 { text-align: center; margin-bottom: 30px; font-size: 32px; font-weight: 700; letter-spacing: -0.5px; }
            .form-group { margin-bottom: 20px; }
            .form-group input, .form-group select, .form-group textarea {
                width: 100%; padding: 14px; border: 1px solid #e0e0e0; border-radius: 10px;
                font-family: inherit; font-size: 15px; background: #ffffff; box-sizing: border-box;
                color: #000000;
            }
            .form-group input::placeholder { color: #a0a0a0; }
            .form-group label { display: block; text-align: left; font-weight: 700; margin-bottom: 8px; font-size: 14px; }
            
            .btn-blue-submit {
                width: 100%; background: #0066ff; color: white; border: none; padding: 15px;
                border-radius: 10px; font-weight: 700; font-family: inherit; font-size: 16px; cursor: pointer;
                transition: background 0.2s; text-align: center; display: block; text-decoration: none; margin-top: 10px;
            }
            .btn-blue-submit:hover { background: #0052cc; }
            .close-modal {
                position: absolute; top: 15px; right: 20px; background: none; border: none;
                font-size: 28px; cursor: pointer; color: #a0a0a0; font-weight: 500; text-decoration: none;
                line-height: 1;
            }
            .close-modal:hover { color: #000000; }
        </style>
    </head>
    <body id="app">
        <header :class="{ dark: store.dark }">
            <div class="logo">
                <h2>The Goy List</h2>
                <p>v1.0.0</p>
            </div>
            <nav class="nav">
                <router-link class="nav__tab" to="/">
                    <span class="type-label-lg">List</span>
                </router-link>
                <router-link class="nav__tab" to="/leaderboard">
                    <span class="type-label-lg">Leaderboard</span>
                </router-link>
                <router-link class="nav__tab" to="/roulette">
                    <span class="type-label-lg">Roulette</span>
                </router-link>
                <div class="nav__actions">
                    <button class="nav__icon" @click.prevent="store.toggleDark()">
                        <img :src="store.dark ? '/assets/light.svg' : '/assets/dark.svg'" alt="" />
                    </button>
                    <a class="nav__icon" href="https://discord.gg" target="_blank">
                        <img src="/assets/discord.svg" alt="Discord" />
                    </a>
                    
                    <button class="nav__cta type-label-lg" @click="store.activeModal = 'record'" style="background:none; border:none; color:inherit; font:inherit; cursor:pointer;">Submit Record</button>
                    <button class="nav__cta type-label-lg" @click="store.activeModal = 'login'" style="background:none; border:none; color:inherit; font:inherit; cursor:pointer;">Login</button>
                    <button class="nav__cta type-label-lg" @click="store.activeModal = 'register'" style="background:none; border:none; color:inherit; font:inherit; cursor:pointer;">Register</button>
                </div>
            </nav>
        </header>

        <div class="custom-modal-overlay" v-if="store.activeModal === 'record'" @click.self="store.activeModal = ''">
            <div class="form-container">
                <button class="close-modal" @click="store.activeModal = ''">×</button>
                <h2 style="font-size: 26px;">Submit a Record</h2>
                <form action="https://formspree.io/f/xrevpbql" method="POST">
                    <div class="form-group"><label>Username</label><input type="text" name="username" placeholder="Your username" required /></div>
                    <div class="form-group">
                        <label>Level</label>
                        <select name="level" required>
                            <option value="" disabled selected>Select a level...</option>
                            <option value="level1">Shitty Andromeda</option>
                            <option value="level2">Shitty Acheron</option>
                            <option value="level3">Shitty Nhelv</option>
                        </select>
                    </div>
                    <div class="form-group"><label>Record Link</label><input type="url" name="record_link" placeholder="https://..." required /></div>
                    <div class="form-group"><label>Raw Footage Link</label><input type="url" name="footage_link" placeholder="https://..." required /></div>
                    <div class="form-group"><label>Notes:</label><textarea name="notes" rows="3" placeholder="Any additional notes..."></textarea></div>
                    <button type="submit" class="btn-blue-submit" style="background: #7baaff;">Submit</button>
                </form>
            </div>
        </div>

        <div class="custom-modal-overlay" v-if="store.activeModal === 'login'" @click.self="store.activeModal = ''">
            <div class="form-container">
                <button class="close-modal" @click="store.activeModal = ''">×</button>
                <h2>Login</h2>
                <form action="#" onsubmit="alert('Database connection configured next!'); return false;">
                    <div class="form-group"><input type="text" placeholder="Username" required /></div>
                    <div class="form-group"><input type="password" placeholder="Password" required /></div>
                    <button type="submit" class="btn-blue-submit">Login</button>
                </form>
            </div>
        </div>

        <div class="custom-modal-overlay" v-if="store.activeModal === 'register'" @click.self="store.activeModal = ''">
            <div class="form-container">
                <button class="close-modal" @click="store.activeModal = ''">×</button>
                <h2>Register</h2>
                <form action="#" onsubmit="alert('Database connection configured next!'); return false;">
                    <div class="form-group"><input type="text" placeholder="Username" required /></div>
                    <div class="form-group"><input type="password" placeholder="Password" required /></div>
                    <div class="form-group"><input type="password" placeholder="Confirm Password" required /></div>
                    <button type="submit" class="btn-blue-submit">Register</button>
                </form>
            </div>
        </div>

        <router-view :class="{ dark: store.dark }"></router-view>
    </body>
</html>
