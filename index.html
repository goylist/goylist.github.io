<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=1024" />
        <title>The Goy List</title>

        <link rel="icon" href="/list_icon.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@500;700&display=swap" rel="stylesheet" />
        <link rel="stylesheet" type="text/css" href="/css/reset.css" />
        <link rel="stylesheet" type="text/css" href="/css/typography.css" />
        <link rel="stylesheet" type="text/css" href="/css/main.css" />
        <link rel="stylesheet" type="text/css" href="/css/pages/list.css" />
        <link rel="stylesheet" type="text/css" href="/css/pages/leaderboard.css" />
        <link rel="stylesheet" type="text/css" href="/css/pages/roulette.css" />
        <link rel="stylesheet" type="text/css" href="/css/components/nav.css" />
        <link rel="stylesheet" type="text/css" href="/css/components/btn.css" />
        <link rel="stylesheet" type="text/css" href="/css/components/tabs.css" />
        
        <script src="https://unpkg.com/vue@3.2.31/dist/vue.global.js"></script>
        <script src="https://unpkg.com/vue-router@4.0.14/dist/vue-router.global.prod.js"></script>
        <script type="module" src="/js/main.js"></script>

        <style>
            /* Modal display logic completely tied to Vue's clean style bindings */
            .custom-modal-overlay {
                position: fixed;
                top: 0; left: 0; width: 100%; height: 100%;
                background: rgba(0, 0, 0, 0.6);
                display: flex; justify-content: center; align-items: center;
                z-index: 99999;
            }
            .form-container {
                background: #ffffff;
                padding: 40px 30px;
                border-radius: 20px;
                width: 400px;
                box-shadow: 0 12px 30px rgba(0,0,0,0.15);
                font-family: 'Lexend Deca', sans-serif;
                color: #000000;
                position: relative;
                text-align: center;
            }
            .form-container h2 { text-align: center; margin-bottom: 30px; font-size: 32px; font-weight: 700; letter-spacing: -0.5px; }
            .form-group { margin-bottom: 20px; }
            .form-group input, .form-group select, .form-group textarea {
                width: 100%; padding: 14px; border: 1px solid #e0e0e0; border-radius: 10px;
                font-family: inherit; font-size: 15px; background: #ffffff; box-sizing: border-box;
                color: #000000;
            }
            .form-group input::placeholder { color: #a0a0a0; }
            .form-group label { display: block; text-align: left; font-weight: 700; margin-bottom: 8px; font-size: 14px; }
            
            .btn-blue-submit {
                width: 100%; background: #0066ff; color: white; border: none; padding: 15px;
                border-radius: 10px; font-weight: 700; font-family: inherit; font-size: 16px; cursor: pointer;
                transition: background 0.2s, transform 0.1s;
                text-align: center; display: block; text-decoration: none; margin-top: 10px;
            }
            .btn-blue-submit:hover { background: #0052cc; }
            .btn-blue-submit:active { transform: scale(0.98); }
            .close-modal {
                position: absolute; top: 15px; right: 20px; background: none; border: none;
                font-size: 28px; cursor: pointer; color: #a0a0a0; font-weight: 500; text-decoration: none;
                line-height: 1;
            }
            .close-modal:hover { color: #000000; }
            .form-footer-text { font-size: 12px; font-weight: 500; color: #666; text-align: center; margin: 20px 0 0 0; }
        </style>
    </head>
    <body id="app">
        <!-- We wrap the layout with global Vue template variables to show/hide popup windows safely -->
        <div v-scope="{ activeModal: '' }">
            
            <header :class="{ dark: store.dark }">
                <div class="logo">
                    <h2>The Goy List</h2>
                    <p>v1.0.0</p>
                </div>
                <nav class="nav">
                    <router-link class="nav__tab" to="/">
                        <span class="type-label-lg">List</span>
                    </router-link>
                    <router-link class="nav__tab" to="/leaderboard">
                        <span class="type-label-lg">Leaderboard</span>
                    </router-link>
                    <router-link class="nav__tab" to="/roulette">
                        <span class="type-label-lg">Roulette</span>
                    </router-link>
                    <div class="nav__actions">
                        <button class="nav__icon" @click.prevent="store.toggleDark()">
                            <img :src="store.dark ? '/assets/light.svg' : '/assets/dark.svg'" alt="" />
                        </button>
                        <a class="nav__icon" href="#" target="_blank">
                            <img src="/assets/discord.svg" alt="Discord Logo" />
                        </a>
                        
                        <!-- Using Vue click triggers instead of conflicting raw onclick commands -->
                        <button class="nav__cta type-label-lg" @click="activeModal = 'record'" style="background:none; border:none; color:inherit; font:inherit; cursor:pointer;">Submit Record</button>
                        <button class="nav__cta type-label-lg" @click="activeModal = 'login'" style="background:none; border:none; color:inherit; font:inherit; cursor:pointer;">Login</button>
                        <button class="nav__cta type-label-lg" @click="activeModal = 'register'" style="background:none; border:none; color:inherit; font:inherit; cursor:pointer;">Register</button>
                    </div>
                </nav>
            </header>

            <!-- SUBMIT RECORD POPUP FORM -->
            <div class="custom-modal-overlay" v-if="activeModal === 'record'" @click.self="activeModal = ''">
                <div class="form-container">
                    <button class="close-modal" @click="activeModal = ''">×</button>
                    <h2 style="font-size: 26px;">Submit a Record</h2>
                    <form @submit.prevent="alert('Record Submitted!'); activeModal = ''">
                        <div class="form-group"><label>Username</label><input type="text" placeholder="Your username" required /></div>
                        <div class="form-group">
                            <label>Level</label>
                            <select required>
                                <option value="" disabled selected>Select a level...</option>
                                <option value="level1">Shitty Andromeda</option>
                                <option value="level2">Shitty Acheron</option>
                                <option value="level3">Shitty Nhelv</option>
                            </select>
                        </div>
                        <div class="form-group"><label>Record Link</label><input type="url" placeholder="https://..." required /></div>
                        <div class="form-group"><label>Raw Footage Link</label><input type="url" placeholder="https://..." required /></div>
                        <div class="form-group"><label>Notes:</label><textarea rows="3" placeholder="Any additional notes..."></textarea></div>
                        <button type="submit" class="btn-blue-submit" style="background: #7baaff; box-shadow: none;">Submit</button>
                    </form>
                </div>
            </div>

            <!-- LAYOUT LOGIN MODAL -->
            <div class="custom-modal-overlay" v-if="activeModal === 'login'" @click.self="activeModal = ''">
                <div class="form-container">
                    <button class="close-modal" @click="activeModal = ''">×</button>
                    <h2>Login</h2>
                    <form @submit.prevent="alert('Database profile setup configured next!'); activeModal = ''">
                        <div class="form-group">
                            <input type="text" placeholder="Username" required />
                        </div>
                        <div class="form-group">
                            <input type="password" placeholder="Password" required />
                        </div>
                        <button type="submit" class="btn-blue-submit">Login</button>
                    </form>
                </div>
            </div>

            <!-- LAYOUT REGISTER MODAL -->
            <div class="custom-modal-overlay" v-if="activeModal === 'register'" @click.self="activeModal = ''">
                <div class="form-container">
                    <button class="close-modal" @click="activeModal = ''">×</button>
                    <h2>Register</h2>
                    <form @submit.prevent="alert('Database profile setup configured next!'); activeModal = ''">
                        <div class="form-group">
                            <input type="text" placeholder="Username" required />
                        </div>
                        <div class="form-group">
                            <input type="password" placeholder="Password" required />
                        </div>
                        <div class="form-group">
                            <input type="password" placeholder="Confirm Password" required />
                        </div>
                        <button type="submit" class="btn-blue-submit">Register</button>
                    </form>
                </div>
            </div>

            <!-- This renders the rest of your standard template components dynamically -->
            <router-view :class="{ dark: store.dark }"></router-view>
        </div>
    </body>
</html>
