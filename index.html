<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=1024" />
        <title>The Goy List</title>

        <!-- Replace your server icon by uploading an image file named "list_icon.png"-->
        <link rel="icon" href="/list_icon.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@500;700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" type="text/css" href="/css/reset.css" />
        <link rel="stylesheet" type="text/css" href="/css/typography.css" />
        <link rel="stylesheet" type="text/css" href="/css/main.css" />
        <link rel="stylesheet" type="text/css" href="/css/pages/list.css" />
        <link
            rel="stylesheet"
            type="text/css"
            href="/css/pages/leaderboard.css"
        />
        <link rel="stylesheet" type="text/css" href="/css/pages/roulette.css" />
        <link rel="stylesheet" type="text/css" href="/css/components/nav.css" />
        <link rel="stylesheet" type="text/css" href="/css/components/btn.css" />
        <link
            rel="stylesheet"
            type="text/css"
            href="/css/components/tabs.css"
        />
        <script src="https://unpkg.com/vue@3.2.31/dist/vue.global.js"></script>
        <script src="https://unpkg.com/vue-router@4.0.14/dist/vue-router.global.prod.js"></script>
        <script type="module" src="/js/main.js"></script>

        <!-- Form Styling to match image_c9c5b7.png -->
        <style>
            .modal-overlay {
                position: fixed;
                top: 0; left: 0; width: 100%; height: 100%;
                background: rgba(0, 0, 0, 0.5);
                display: flex; justify-content: center; align-items: center;
                z-index: 9999;
            }
            .form-container {
                background: #ffffff;
                padding: 30px;
                border-radius: 16px;
                width: 450px;
                box-shadow: 0 10px 25px rgba(0,0,0,0.1);
                font-family: 'Lexend Deca', sans-serif;
                color: #000000;
                position: relative;
            }
            .form-container h2 { text-align: center; margin-bottom: 20px; font-size: 24px; font-weight: 700; }
            .form-group { margin-bottom: 15px; }
            .form-group label { display: block; font-weight: 700; margin-bottom: 8px; font-size: 14px; }
            .form-group input, .form-group select, .form-group textarea {
                width: 100%; padding: 10px; border: 1px solid #7e7e7e; border-radius: 6px;
                font-family: inherit; font-size: 14px; background: #f9f9f9; box-sizing: border-box;
            }
            .radio-group { display: flex; gap: 20px; margin-top: 5px; }
            .radio-item { display: flex; align-items: center; gap: 5px; font-weight: 700; cursor: pointer; }
            .radio-item input { width: auto; cursor: pointer; }
            .form-footer-text { font-size: 12px; font-weight: 700; text-align: center; margin: 20px 0; }
            .btn-submit-form {
                width: 100%; background: #7baaff; color: white; border: none; padding: 12px;
                border-radius: 8px; font-weight: 700; font-family: inherit; font-size: 16px; cursor: pointer;
                transition: background 0.2s;
            }
            .btn-submit-form:hover { background: #6999ee; }
            .close-modal {
                position: absolute; top: 15px; right: 20px; background: none; border: none;
                font-size: 20px; cursor: pointer; color: #7e7e7e; font-weight: 700;
            }
        </style>
    </head>
    <body id="app">
        <!-- We add a simple data variable to track if the form window is open -->
        <div v-scope="{ formOpen: false }">
            
            <header :class="{ dark: store.dark }">
                <div class="logo">
                    <h2>The Goy List</h2>
                    <p>v1.0.0</p>
                </div>
                <nav class="nav">
                    <router-link class="nav__tab" to="/">
                        <span class="type-label-lg">List</span>
                    </router-link>
                    <router-link class="nav__tab" to="/leaderboard">
                        <span class="type-label-lg">Leaderboard</span>
                    </router-link>
                    <router-link class="nav__tab" to="/roulette">
                        <span class="type-label-lg">Roulette</span>
                    </router-link>
                    <div class="nav__actions">
                        <button
                            class="nav__icon"
                            @click.prevent="store.toggleDark()"
                        >
                            <img
                                :src="store.dark ? '/assets/light.svg' : '/assets/dark.svg'"
                                alt=""
                            />
                        </button>
                        <a class="nav__icon" href="#" target="_blank">
                            <img src="/assets/discord.svg" alt="Discord Logo" />
                        </a>
                        
                        <!-- Clicking this button now flips our window setting to true -->
                        <button
                            class="nav__cta type-label-lg"
                            @click="formOpen = true"
                            style="background: #ffffff; color: #000000; border: none; cursor: pointer;"
                            >Submit Record</button
                        >

                        <a class="nav__cta type-label-lg" href="#/login">Login</a>
                        <a class="nav__cta type-label-lg" href="#/register">Register</a>
                    </div>
                </nav>
            </header>

            <!-- THE SUBMIT RECORD POPUP FORM (Hidden by default, shows when formOpen is true) -->
            <div class="modal-overlay" v-if="formOpen" @click.self="formOpen = false">
                <div class="form-container">
                    <button class="close-modal" @click="formOpen = false">×</button>
                    <h2>Submit a Record</h2>
                    
                    <form @submit.prevent="alert('Record Submitted!')">
                        <div class="form-group">
                            <label>Username</label>
                            <input type="text" placeholder="Your username" required />
                        </div>

                        <div class="form-group">
                            <label>Level</label>
                            <select required>
                                <option value="" disabled selected>Select a level...</option>
                                <option value="level1">Shitty Andromeda</option>
                                <option value="level2">Shitty Acheron</option>
                                <option value="level3">Shitty Nhelv</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Record Link</label>
                            <input type="url" placeholder="https://..." required />
                        </div>

                        <div class="form-group">
                            <label>Raw Footage Link</label>
                            <input type="url" placeholder="https://..." required />
                        </div>

                        <div class="form-group">
                            <label>Notes:</label>
                            <textarea rows="3" placeholder="Any additional notes..."></textarea>
                        </div>

                        <div class="form-group">
                            <label>Platform</label>
                            <div class="radio-group">
                                <label class="radio-item">
                                    <input type="radio" name="platform" value="mobile" /> Mobile
                                </label>
                                <label class="radio-item">
                                    <input type="radio" name="platform" value="pc" checked /> PC
                                </label>
                            </div>
                        </div>

                        <p class="form-footer-text">Please read the Submission Guidelines before submitting.</p>

                        <button type="submit" class="btn-submit-form">Submit</button>
                    </form>
                </div>
            </div>

            <router-view :class="{ dark: store.dark }"></router-view>
        </div>
    </body>
</html>
